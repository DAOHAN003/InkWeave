[workspace]
resolver = "2"
members = [
    "world_state",
    "causal_core",
    "lingming_core",
    "memory_core",
    "lingming_com",
    "agent_runtime",
    "llm_adapter",
    "novel_writer_suite",
    "security_suite",
    "config_system",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ling Ming <wanxiang@research.lab>"]
license = "Apache-2.0"
repository = "https://github.com/DAOHAN003/Wanxiang"
description = "Composable Rust crates for experimental world-state, causal-graph, memory and agent workflows."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
