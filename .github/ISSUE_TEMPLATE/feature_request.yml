name: 功能建议
description: 提一个新功能或改进建议
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 这个建议是为了解决什么痛点？当前怎么做觉得不顺？
      placeholder: 我现在为了实现 X，要先 Y 再 Z，太麻烦
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 你希望墨织怎么实现？UI 长什么样？交互流程是什么？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有别的实现思路？为什么觉得你的方案更好？

  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 编辑器（写作时）
        - AI 协作（生成/审校）
        - 设定系统（角色/世界观/时间线）
        - 故事矿脉 / 分支探索
        - 世界可视化（3D 星图等）
        - 分析（质量/节奏/AI 痕迹）
        - 数据与导出
        - 界面与交互
        - 其他
    validations:
      required: true
