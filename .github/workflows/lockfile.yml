name: Lockfile

# 社区版 src-tauri/Cargo.lock 的权威生成器：
# 本机（Windows/离线缓存不全）无法产出 Linux 一致的完整解析，
# 由 ubuntu runner 执行 cargo generate-lockfile 后直接提交——lock 与 CI 同环境，天然一致。
# 手动触发：Actions → Lockfile → Run workflow。产物变更时自动 commit 到 main。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Generate src-tauri/Cargo.lock
        run: cd src-tauri && cargo generate-lockfile

      - name: Verify locked resolution
        run: cd src-tauri && cargo metadata --locked --format-version 1 > /dev/null

      - name: Commit lock if changed
        run: |
          git config user.name "inkweave-lockfile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "lock 无变化"
          else
            git commit -m "chore: regenerate src-tauri/Cargo.lock（Linux 权威解析）"
            git push
          fi
